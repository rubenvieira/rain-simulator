<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rain Simulator — rain on a window at night</title>
    <meta name="description" content="Rain running down a window over a city street at night. Drag to wipe the fogged glass." />
    <meta name="theme-color" content="#0b0d14" />
    <meta property="og:title" content="Rain Simulator" />
    <meta property="og:description" content="Rain running down a window over a city street at night. Drag to wipe the fogged glass." />
    <meta property="og:image" content="https://play.rubenv.net/rain-simulator/og.jpg" />
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <canvas id="glass" aria-label="Rain running down a window over a city street at night. Drag across the glass to wipe away the condensation."></canvas>
    <p class="status" role="status"></p>
    <nav class="pc-dock pc-glass pc-wrap" aria-label="Weather controls">
      <label class="pc-slider">Rain<input id="rain" type="range" min="0" max="100" /></label>
      <label class="pc-slider">Wind<input id="wind" type="range" min="-100" max="100" /></label>
      <label class="pc-slider">Fog<input id="fog" type="range" min="0" max="100" /></label>
      <span class="pc-sep"></span>
      <div class="pc-group">
        <button id="lightning" type="button" class="pc-text" aria-pressed="true">Lightning</button>
        <button id="pause" type="button" class="pc-text" aria-pressed="false">Pause</button>
        <button id="reset" type="button" class="pc-text">Fog the glass</button>
      </div>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
